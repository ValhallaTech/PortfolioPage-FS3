name: Sync Runtime Versions

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  sync-runtime-versions:
    name: Sync Node and Yarn pins
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Update pinned Node and Yarn versions
        run: node scripts/sync-runtime-versions.mjs

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          draft: always-true
          branch: chore/sync-runtime-versions
          delete-branch: true
          title: "chore: sync Node and Yarn version pins"
          commit-message: "chore: sync Node and Yarn version pins"
          body: |
            Automated sync of pinned runtime/toolchain versions:
            - package.json packageManager
            - .nvmrc Node version
            - netlify.toml NODE_VERSION
          labels: dependencies
